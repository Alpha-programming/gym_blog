{% extends "base.html" %}

{% block title %}Add Exercise{% endblock %}

{% block content %}
<h2>Add Exercise to Workout on {{ workout.date }}</h2>

<form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Add Exercise</button>
  <a href="{% url 'workout_detail' workout.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
