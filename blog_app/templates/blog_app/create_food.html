{% extends "base.html" %}

{% block title %}Add Food Entry{% endblock %}

{% block content %}
<h2>Add Food Entry to Food Plan on {{ food_plan.date }}</h2>

<form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Add Food Entry</button>
  <a href="{% url 'foodlog_detail' food_plan.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
